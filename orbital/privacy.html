<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Launcher privacy policy has moved</title>

  <!-- The policy itself now lives on Orbital Launcher's own site. This page is
       only here because the Google Play listing was published pointing at this
       URL; it redirects rather than 404s so that listing keeps resolving. Once
       the Play Console URL is changed to orbitallauncher.com/privacy.html this
       file can be deleted outright. -->
  <link rel="canonical" href="https://orbitallauncher.com/privacy.html">
  <meta http-equiv="refresh" content="0; url=https://orbitallauncher.com/privacy.html">
  <meta name="robots" content="noindex">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07090e;
      color: #f0f4f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      max-width: 34rem;
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0 0 12px;
    }

    p {
      color: #94a3b8;
      margin: 0 0 20px;
    }

    a {
      color: #00ffaa;
    }
  </style>
</head>
<body>
  <main>
    <h1>This policy has moved</h1>
    <p>
      Orbital Launcher's privacy policy now lives on its own site. You should be
      redirected automatically.
    </p>
    <p>
      <a href="https://orbitallauncher.com/privacy.html">orbitallauncher.com/privacy.html</a>
    </p>
  </main>

  <script>
    location.replace('https://orbitallauncher.com/privacy.html');
  </script>
</body>
</html>
