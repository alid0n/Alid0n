    /* Lazy-loaded video thumbnails: a static poster image + play button take
       the place of the iframe until clicked, so pages with several embeds
       don't pay YouTube's load cost for videos nobody watches. */
    .yt-lazy {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      background: #000;
    }

    .yt-lazy .yt-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .yt-lazy .yt-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid #ffffff;
      color: #ffffff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .yt-lazy:hover .yt-play-btn {

      color: #05100c;
      transform: translate(-50%, -50%) scale(1.08);

/* Expandable drawer styling with smooth dynamic height transition */
    .card-expanded-drawer {
      width: 100%;
      flex-basis: 100%;
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  margin-top 0.35s ease,
                  padding-top 0.35s ease,
                  border-color 0.35s ease;
      margin-top: 0;
      padding-top: 0;
      border-top: 1px dashed transparent;
      overflow: hidden;
    }

    .card-expanded-drawer.open {
      grid-template-rows: 1fr;
      margin-top: 20px;
      padding-top: 20px;
      border-top-color: rgba(255, 255, 255, 0.15);
    }

    .card-drawer-inner {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .card-expanded-drawer.open .card-drawer-inner {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.1s;
    }
