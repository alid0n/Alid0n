<script>
    /* ==========================================
       5. CORE GAME SCRIPTS & CONTROLLERS
       ========================================== */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    const contentWrapper = document.getElementById('contentWrapper');
    const themeSelect = document.getElementById('themeSelect');
    const gameHint = document.getElementById('gameHint');
    const mobileGameToggle = document.getElementById('mobileGameToggle');
    const touchControls = document.getElementById('touchControls');

    let currentTheme = 'space';
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);
    let isPlayingMobileGame = false;

    mobileGameToggle.addEventListener('click', () => {
      isPlayingMobileGame = !isPlayingMobileGame;
      if (isPlayingMobileGame) {
        mobileGameToggle.textContent = 'QUIT';
        mobileGameToggle.classList.add('playing');
        contentWrapper.classList.add('dimmed');
        canvas.classList.remove('faded');
        touchControls.classList.add('active');
        document.body.style.overflow = 'hidden'; // Lock background scrolling on mobile
      } else {
        restorePortfolioFocus();
      }
    });

    function restorePortfolioFocus() {
      if (isPlayingMobileGame) return;
      isPlayingMobileGame = false;
      mobileGameToggle.textContent = 'PLAY GAME';
      mobileGameToggle.classList.remove('playing');
      contentWrapper.classList.remove('dimmed');
      canvas.classList.add('faded');
      touchControls.classList.remove('active');
      document.body.style.overflow = ''; // Restore scrolling
    }

    // Restore focus on mouse movement, scrolling, or wheel actions
    window.addEventListener('mousemove', restorePortfolioFocus, { passive: true });
    window.addEventListener('wheel', restorePortfolioFocus, { passive: true });
    window.addEventListener('scroll', restorePortfolioFocus, { passive: true });

    // Prevent page scrolling entirely while in mobile game mode
    window.addEventListener('touchmove', (e) => {
      if (isPlayingMobileGame) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      if (currentTheme === 'space') initInvaders(false);
      if (currentTheme === 'pac') initPacGame(false);
      if (currentTheme === 'synth') initSynthRacer(false);
      if (currentTheme === 'rpg') initRPGGame(false);
    });

    function checkRectCollision(r1, r2) {
      return (r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y);
    }

    const keys = {};
    function bindTouchButton(id, code) {
      const el = document.getElementById(id);
      if (!el) return;
      const pressOn = (e) => {
        e.preventDefault();
        keys[code] = true;
        el.classList.add('pressed');
        if (code === 'Space' && currentTheme === 'space') firePlayerWeapon();
        if (code === 'Space' && currentTheme === 'rpg') performHeroAttack();
      };
      const pressOff = (e) => {
        e.preventDefault();
        keys[code] = false;
        el.classList.remove('pressed');
      };
      el.addEventListener('touchstart', pressOn, { passive: false });
      el.addEventListener('touchend', pressOff, { passive: false });
      el.addEventListener('mousedown', pressOn);
      el.addEventListener('mouseup', pressOff);
    }

    bindTouchButton('btnUp', 'ArrowUp');
    bindTouchButton('btnDown', 'ArrowDown');
    bindTouchButton('btnLeft', 'ArrowLeft');
    bindTouchButton('btnRight', 'ArrowRight');
    bindTouchButton('btnAction', 'Space');

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(e.code)) {
        if (!isPlayingMobileGame) {
          contentWrapper.classList.add('dimmed');
          canvas.classList.remove('faded');
        }
      }
      if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
      keys[e.code] = true;

      if (currentTheme === 'space' && e.code === 'Space') firePlayerWeapon();
      if (currentTheme === 'rpg' && e.code === 'Space') performHeroAttack();

      if (currentTheme === 'pac') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { pac.nextDirX = -1; pac.nextDirY = 0; }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { pac.nextDirX = 1; pac.nextDirY = 0; }
        if (e.code === 'ArrowUp' || e.code === 'KeyW') { pac.nextDirX = 0; pac.nextDirY = -1; }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { pac.nextDirX = 0; pac.nextDirY = 1; }
      }
    });

    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    function drawHUD(score, startTime, lives = null, accentColor = '#00ffaa', wave = null, extraText = null) {
      const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
      const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      const s = String(elapsedSec % 60).padStart(2, '0');

      ctx.save();
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillStyle = accentColor;
      ctx.shadowColor = accentColor;
      ctx.shadowBlur = 6;

      ctx.fillText(`SCORE: ${score}`, 25, 35);
      ctx.fillText(`TIME: ${m}:${s}`, 25, 55);

      let offsetY = 75;
      if (wave !== null) { ctx.fillText(`LEVEL: ${wave}`, 25, offsetY); offsetY += 20; }
      if (lives !== null) {
        let heartStr = '';
        for (let i = 0; i < lives; i++) heartStr += '♥ ';
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.fillText(`LIVES: ${heartStr}`, 25, offsetY);
        offsetY += 20;
      }
      if (extraText) {
        ctx.fillStyle = accentColor;
        ctx.shadowColor = accentColor;
        ctx.fillText(extraText, 25, offsetY);
      }
      ctx.restore();
    }

    /* ------------------------------------------
       6. GAME ENGINES (Space, Pac, Synth, RPG)
       ------------------------------------------ */
    // Space Invaders Engine
    const player = { x: width / 2, y: height - 60, w: 36, h: 20, speed: 7.5, invuln: 0, weapon: 'standard', weaponTimer: 0 };
    let bullets = [], enemyLasers = [], invaders = [], powerups = [];
    let invaderDir = 1, spaceScore = 0, spaceLives = 3, spaceLevel = 1, spaceStartTime = Date.now(), animTick = 0;
    let invaderRows = 2, invaderCols = 5;
    const invaderSize = 28;

    function initInvaders(fullReset = true) {
      if (fullReset) {
        spaceScore = 0; spaceLives = 3; spaceLevel = 1; spaceStartTime = Date.now();
        player.weapon = 'standard'; player.weaponTimer = 0; player.invuln = 0;
      }
      bullets = []; enemyLasers = []; invaders = []; powerups = []; invaderDir = 1;
      player.x = width / 2 - player.w / 2; player.y = height - 60;

      if (spaceLevel === 1) { invaderRows = 2; invaderCols = 5; }
      else if (spaceLevel === 2) { invaderRows = 3; invaderCols = 6; }
      else if (spaceLevel === 3) { invaderRows = 3; invaderCols = 7; }
      else {
        invaderRows = Math.min(4, 3 + Math.floor(spaceLevel / 3));
        invaderCols = Math.min(9, 6 + Math.floor(spaceLevel / 2));
      }

      const spacingX = Math.min(75, width / (invaderCols + 2));
      const startX = (width - invaderCols * spacingX) / 2;

      for (let r = 0; r < invaderRows; r++) {
        for (let c = 0; c < invaderCols; c++) {
          let type = 'scout', hp = 1;
          if (spaceLevel === 2 && r === 0) { type = 'cruiser'; hp = 2; }
          else if (spaceLevel >= 3) {
            if (r === 0) { type = 'dreadnought'; hp = 3; }
            else if (r === 1) { type = 'cruiser'; hp = 2; }
          }
          let cooldown = spaceLevel === 1 ? (180 + Math.floor(Math.random() * 320)) : (100 + Math.floor(Math.random() * 220));
          invaders.push({ x: startX + c * spacingX, y: 90 + r * 50, w: invaderSize, h: invaderSize, row: r, col: c, type, hp, alive: true, cooldown });
        }
      }
    }

    function firePlayerWeapon() {
      const cx = player.x + player.w / 2;
      if (player.weapon === 'standard') bullets.push({ x: cx - 2, y: player.y, w: 4, h: 10, vx: 0, vy: -10, damage: 1, color: '#38bdf8' });
      else if (player.weapon === 'spread') {
        bullets.push({ x: cx - 2, y: player.y, w: 5, h: 10, vx: 0, vy: -10, damage: 1, color: '#00ffff' });
        bullets.push({ x: cx - 6, y: player.y, w: 5, h: 10, vx: -2.5, vy: -9.5, damage: 1, color: '#00ffff' });
        bullets.push({ x: cx + 2, y: player.y, w: 5, h: 10, vx: 2.5, vy: -9.5, damage: 1, color: '#00ffff' });
      } else if (player.weapon === 'laser') {
        bullets.push({ x: player.x + 4, y: player.y - 4, w: 3, h: 18, vx: 0, vy: -15, damage: 1, color: '#ffee00', pierce: true });
        bullets.push({ x: player.x + player.w - 7, y: player.y - 4, w: 3, h: 18, vx: 0, vy: -15, damage: 1, color: '#ffee00', pierce: true });
      } else if (player.weapon === 'plasma') {
        bullets.push({ x: cx - 5, y: player.y - 4, w: 10, h: 14, vx: 0, vy: -8, damage: 2, color: '#ff00ff' });
      }
    }

    function spawnPowerup(x, y) {
      if (Math.random() > 0.35) return;
      const roll = Math.random();
      let kind = 'weapon', label = 'W', color = '#00ffff';
      if (roll < 0.20) { kind = 'life'; label = '+'; color = '#ff0055'; }
      else if (roll < 0.45) { kind = 'score'; label = '$'; color = '#ffeb3b'; }
      powerups.push({ x, y, w: 20, h: 20, vy: 2.2, kind, label, color });
    }

    function updateSpace() {
      animTick++;
      if (player.invuln > 0) player.invuln--;
      if (player.weaponTimer > 0 && --player.weaponTimer <= 0) player.weapon = 'standard';

      if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
      player.x = Math.max(10, Math.min(width - player.w - 10, player.x));

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx || 0; b.y += b.vy;
        if (b.y < -20 || b.x < 0 || b.x > width) bullets.splice(i, 1);
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;
        if (checkRectCollision(player, p)) {
          if (p.kind === 'life') { if (spaceLives < 5) spaceLives++; spaceScore += 100; }
          else if (p.kind === 'score') spaceScore += 500;
          else if (p.kind === 'weapon') {
            const weapons = ['spread', 'laser', 'plasma'];
            player.weapon = weapons[Math.floor(Math.random() * weapons.length)];
            player.weaponTimer = 720;
            spaceScore += 150;
          }
          powerups.splice(i, 1);
          continue;
        }
        if (p.y > height) powerups.splice(i, 1);
      }

      const aliveInvaders = invaders.filter(inv => inv.alive);
      const baseSpeed = spaceLevel === 1 ? 1.5 : 1.9;
      const speedModifier = baseSpeed + (1 - aliveInvaders.length / (invaderRows * invaderCols)) * 1.5 + (spaceLevel - 1) * 0.35;

      let edgeReached = false;
      invaders.forEach((inv) => {
        if (!inv.alive) return;
        inv.x += invaderDir * speedModifier;
        if (inv.x + inv.w > width - 20 || inv.x < 20) edgeReached = true;

        const isBottom = !invaders.some(other => other.alive && other.col === inv.col && other.row > inv.row);
        if (--inv.cooldown <= 0 && isBottom) {
          if (spaceLevel === 1) {
            enemyLasers.push({ x: inv.x + inv.w / 2 - 2, y: inv.y + inv.h, w: 4, h: 10, vy: 4.0, color: '#38bdf8' });
            inv.cooldown = 420 + Math.floor(Math.random() * 240);
          } else {
            enemyLasers.push({ x: inv.x + inv.w / 2 - 2, y: inv.y + inv.h, w: 4, h: 12, vy: 5.2, color: '#ff0055' });
            inv.cooldown = 140 + Math.floor(Math.random() * 140);
          }
        }

        if (checkRectCollision(player, inv) && player.invuln <= 0) {
          if (--spaceLives <= 0) { initInvaders(true); return; }
          player.invuln = 60;
        }
      });

      if (edgeReached) {
        invaderDir *= -1;
        invaders.forEach(inv => { inv.y += 14; if (inv.y > height - 100) initInvaders(true); });
      }

      for (let i = enemyLasers.length - 1; i >= 0; i--) {
        const l = enemyLasers[i];
        l.y += l.vy;
        if (checkRectCollision(player, l) && player.invuln <= 0) {
          enemyLasers.splice(i, 1);
          if (--spaceLives <= 0) { initInvaders(true); return; }
          player.invuln = 60;
          continue;
        }
        if (l.y > height) enemyLasers.splice(i, 1);
      }

      for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
        const b = bullets[bIdx];
        let removed = false;
        for (let inv of invaders) {
          if (inv.alive && checkRectCollision(b, inv)) {
            inv.hp -= b.damage || 1;
            if (!b.pierce && !removed) { bullets.splice(bIdx, 1); removed = true; }
            if (inv.hp <= 0) {
              inv.alive = false;
              spawnPowerup(inv.x + inv.w / 2 - 10, inv.y);
              spaceScore += inv.type === 'dreadnought' ? 500 : (inv.type === 'cruiser' ? 250 : 100);
            }
            if (removed) break;
          }
        }
      }

      if (invaders.length > 0 && invaders.every(inv => !inv.alive)) {
        spaceLevel++; spaceScore += 1000; initInvaders(false);
      }
    }

    function drawEnemy(inv) {
      const cx = inv.x + inv.w / 2, cy = inv.y + inv.h / 2;
      const pulse = Math.sin(animTick * 0.1) * 2;
      ctx.save(); ctx.shadowBlur = 8;
      if (inv.type === 'scout') {
        ctx.fillStyle = '#00ffaa'; ctx.strokeStyle = '#00ffaa'; ctx.shadowColor = '#00ffaa';
        ctx.beginPath(); ctx.moveTo(cx, inv.y + inv.h); ctx.lineTo(inv.x + inv.w + 2, inv.y + 4); ctx.lineTo(cx, inv.y + 8); ctx.lineTo(inv.x - 2, inv.y + 4); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - 2, inv.y + 3, 4, 3);
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(inv.x - 2, inv.y + 1, 3, 5); ctx.fillRect(inv.x + inv.w - 1, inv.y + 1, 3, 5);
      } else if (inv.type === 'cruiser') {
        ctx.fillStyle = '#ff0055'; ctx.strokeStyle = '#ff0055'; ctx.shadowColor = '#ff0055';
        ctx.fillRect(inv.x + 4, inv.y + 4, inv.w - 8, inv.h - 10);
        ctx.fillStyle = inv.hp > 1 ? '#ff3377' : '#881133';
        ctx.fillRect(inv.x, inv.y + 2, 5, inv.h - 4); ctx.fillRect(inv.x + inv.w - 5, inv.y + 2, 5, inv.h - 4);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(inv.x + 7, inv.y + inv.h - 5, 3, 5); ctx.fillRect(inv.x + inv.w - 10, inv.y + inv.h - 5, 3, 5);
        ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(cx, cy - 2, 3 + pulse * 0.5, 0, Math.PI * 2); ctx.fill();
      } else if (inv.type === 'dreadnought') {
        ctx.fillStyle = '#b537f2'; ctx.strokeStyle = '#b537f2'; ctx.shadowColor = '#b537f2';
        ctx.beginPath(); ctx.moveTo(inv.x + 6, inv.y); ctx.lineTo(inv.x + inv.w - 6, inv.y); ctx.lineTo(inv.x + inv.w, inv.y + 10); ctx.lineTo(inv.x + inv.w - 4, inv.y + inv.h); ctx.lineTo(cx, inv.y + inv.h - 4); ctx.lineTo(inv.x + 4, inv.y + 10); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#120422'; ctx.fillRect(inv.x + 5, inv.y + 6, inv.w - 10, inv.h - 14);
        ctx.fillStyle = inv.hp === 3 ? '#00ffff' : (inv.hp === 2 ? '#ff007f' : '#ffffff');
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function drawSpace() {
      if (player.invuln % 6 < 3) {
        ctx.fillStyle = player.weapon !== 'standard' ? '#00ffff' : '#00ffaa';
        ctx.beginPath(); ctx.moveTo(player.x + player.w / 2, player.y); ctx.lineTo(player.x + player.w, player.y + player.h); ctx.lineTo(player.x, player.y + player.h); ctx.closePath(); ctx.fill();
      }
      bullets.forEach(b => { ctx.fillStyle = b.color || '#38bdf8'; ctx.fillRect(b.x, b.y, b.w, b.h); });
      enemyLasers.forEach(l => { ctx.fillStyle = l.color; ctx.fillRect(l.x, l.y, l.w, l.h); });
      powerups.forEach(p => {
        ctx.save(); ctx.fillStyle = '#07090e'; ctx.strokeStyle = p.color; ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h); ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = p.color; ctx.font = '10px "Press Start 2P", monospace'; ctx.fillText(p.label, p.x + 5, p.y + 15); ctx.restore();
      });
      invaders.forEach(inv => { if (inv.alive) drawEnemy(inv); });
      let extraText = player.weapon !== 'standard' ? `WEAPON: ${player.weapon.toUpperCase()} (${Math.ceil(player.weaponTimer / 60)}s)` : null;
      drawHUD(spaceScore, spaceStartTime, spaceLives, '#00ffaa', spaceLevel, extraText);
    }

    // Retro Maze (Pac) & Other Games remain structurally optimized as original
    const pac = { x: 60, y: 60, w: 22, h: 22, speed: 3.2, dirX: 1, dirY: 0, nextDirX: 1, nextDirY: 0, mouth: 0, mouthSpeed: 0.18, invuln: 0 };
    let walls = [], pellets = [], powerPellets = [], ghosts = [], ghostPenGate = null, penExitTile = { x: 0, y: 0 }, mazeBounds = { left: 0, right: 0, tileSize: 20 };
    let pacScore = 0, pacLives = 3, pacLevel = 1, pacStartTime = Date.now(), frightTimer = 0, ghostsEatenChain = 0;
    const ghostColors = ['#ff0000', '#00ffff', '#ffb8de', '#ffb852'];
    const pacMapBlueprint = [
      "############################",
      "#............##............#",
      "#.####.#####.##.#####.####.#",
      "#O####.#####.##.#####.####O#",
      "#.####.#####.##.#####.####.#",
      "#..........................#",
      "#.####.##.########.##.####.#",
      "#.####.##.########.##.####.#",
      "#......##....##....##......#",
      "######.##### ## #####.######",
      "     #.##### ## #####.#     ",
      "     #.##          ##.#     ",
      "     #.## ###--### ##.#     ",
      "######.## #      # ##.######",
      "       .  #      #  .       ",
      "######.## #      # ##.######",
      "     #.## ######## ##.#     ",
      "     #.##          ##.#     ",
      "     #.## ######## ##.#     ",
      "######.## ######## ##.######",
      "#............##............#",
      "#.####.#####.##.#####.####.#",
      "#.####.#####.##.#####.####.#",
      "#O..##................##..O#",
      "###.##.##.########.##.##.###",
      "###.##.##.########.##.##.###",
      "#......##....##....##......#",
      "#.##########.##.##########.#",
      "#.##########.##.##########.#",
      "#..........................#",
      "############################"
    ];

    function resetPacEntities() {
      const rows = pacMapBlueprint.length, cols = pacMapBlueprint[0].length;
      const tileSize = mazeBounds.tileSize || Math.min(Math.floor(width / cols), Math.floor((height - 20) / rows));
      const offsetX = mazeBounds.left, offsetY = Math.floor((height - rows * tileSize) / 2);
      pac.x = offsetX + 13.5 * tileSize - pac.w / 2; pac.y = offsetY + 23 * tileSize + (tileSize - pac.h) / 2;
      pac.dirX = -1; pac.dirY = 0; pac.nextDirX = -1; pac.nextDirY = 0; pac.invuln = 90;
      frightTimer = 0; ghostsEatenChain = 0;
      ghosts = [];
      for (let i = 0; i < 4; i++) {
        ghosts.push({
          x: offsetX + (12.5 + (i % 2)) * tileSize, y: offsetY + 14 * tileSize,
          homeX: offsetX + (12.5 + (i % 2)) * tileSize, homeY: offsetY + 14 * tileSize,
          w: pac.w, h: pac.h, color: ghostColors[i], dirX: 0, dirY: -1,
          speed: 2.2 + (pacLevel - 1) * 0.25, state: 'in_pen', releaseTimer: i * 80
        });
      }
    }

    function initPacGame(fullReset = true) {
      if (fullReset) { pacScore = 0; pacLives = 3; pacLevel = 1; pacStartTime = Date.now(); }
      walls = []; pellets = []; powerPellets = [];
      frightTimer = 0; ghostsEatenChain = 0;
      const rows = pacMapBlueprint.length, cols = pacMapBlueprint[0].length;
      const tileSize = Math.min(Math.floor(width / cols), Math.floor((height - 20) / rows));
      const offsetX = Math.floor((width - cols * tileSize) / 2), offsetY = Math.floor((height - rows * tileSize) / 2);
      mazeBounds = { left: offsetX, right: offsetX + cols * tileSize, tileSize };

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const char = pacMapBlueprint[r][c] || ' ';
          const x = offsetX + c * tileSize, y = offsetY + r * tileSize;
          if (char === '#') walls.push({ x, y, w: tileSize, h: tileSize });
          else if (char === '-') { ghostPenGate = { x, y: y + tileSize / 2 - 2, w: tileSize, h: 4 }; penExitTile = { x, y: y - tileSize }; }
          else if (char === '.') pellets.push({ x: x + tileSize / 2, y: y + tileSize / 2, eaten: false });
          else if (char === 'O') powerPellets.push({ x: x + tileSize / 2, y: y + tileSize / 2, eaten: false });
        }
      }
      pac.w = Math.max(16, tileSize - 4); pac.h = Math.max(16, tileSize - 4);
      resetPacEntities();
    }

    function updatePac() {
      if (pac.invuln > 0) pac.invuln--;
      if (frightTimer > 0) frightTimer--;
      if (pac.nextDirX !== pac.dirX || pac.nextDirY !== pac.dirY) {
        const testBox = { x: pac.x + pac.nextDirX * pac.speed, y: pac.y + pac.nextDirY * pac.speed, w: pac.w, h: pac.h };
        if (!walls.some(w => checkRectCollision(testBox, w))) { pac.dirX = pac.nextDirX; pac.dirY = pac.nextDirY; }
      }
      const moveBox = { x: pac.x + pac.dirX * pac.speed, y: pac.y + pac.dirY * pac.speed, w: pac.w, h: pac.h };
      if (!walls.some(w => checkRectCollision(moveBox, w))) { pac.x += pac.dirX * pac.speed; pac.y += pac.dirY * pac.speed; }

      if (pac.x < mazeBounds.left - pac.w) pac.x = mazeBounds.right - 2;
      else if (pac.x > mazeBounds.right) pac.x = mazeBounds.left - pac.w + 2;

      pac.mouth += pac.mouthSpeed;
      if (pac.mouth > 1 || pac.mouth < 0) pac.mouthSpeed *= -1;

      pellets.forEach(p => { if (!p.eaten && Math.hypot((pac.x + pac.w/2) - p.x, (pac.y + pac.h/2) - p.y) < pac.w/1.3) { p.eaten = true; pacScore += 10; } });
      powerPellets.forEach(p => {
        if (!p.eaten && Math.hypot((pac.x + pac.w/2) - p.x, (pac.y + pac.h/2) - p.y) < pac.w) {
          p.eaten = true; pacScore += 50; frightTimer = 480; ghostsEatenChain = 0;
          ghosts.forEach(g => { if (g.state === 'free') { g.dirX *= -1; g.dirY *= -1; } });
        }
      });
      if (pellets.length > 0 && pellets.every(p => p.eaten)) { pacLevel++; pacScore += 1000; initPacGame(false); }

      const cardinal = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
      ghosts.forEach(g => {
        if (g.state === 'in_pen') { if (--g.releaseTimer <= 0) g.state = 'exiting'; }
        else if (g.state === 'exiting') {
          if (Math.abs(g.x - penExitTile.x) > 2) g.x += (penExitTile.x > g.x ? 1 : -1) * 1.5;
          else if (g.y > penExitTile.y) g.y -= 1.5;
          else { g.state = 'free'; g.dirX = Math.random() > 0.5 ? 1 : -1; g.dirY = 0; }
        } else if (g.state === 'eaten') {
          const dx = g.homeX - g.x, dy = g.homeY - g.y, dist = Math.hypot(dx, dy) || 1;
          if (dist < 4) { g.state = 'in_pen'; g.releaseTimer = 60; } else { g.x += (dx / dist) * 4.5; g.y += (dy / dist) * 4.5; }
        } else {
          const curSpeed = (frightTimer > 0) ? g.speed * 0.65 : g.speed;
          const nextBox = { x: g.x + g.dirX * curSpeed, y: g.y + g.dirY * curSpeed, w: g.w, h: g.h };
          if (walls.some(w => checkRectCollision(nextBox, w)) || Math.random() < 0.03) {
            const shuffled = [...cardinal].sort(() => 0.5 - Math.random());
            for (let d of shuffled) {
              if (!walls.some(w => checkRectCollision({ x: g.x + d.x * (curSpeed + 2), y: g.y + d.y * (curSpeed + 2), w: g.w, h: g.h }, w))) {
                g.dirX = d.x; g.dirY = d.y; break;
              }
            }
          } else { g.x += g.dirX * curSpeed; g.y += g.dirY * curSpeed; }
          if (g.x < mazeBounds.left - g.w) g.x = mazeBounds.right - 2;
          else if (g.x > mazeBounds.right) g.x = mazeBounds.left - g.w + 2;
        }

        if (checkRectCollision(pac, g) && g.state !== 'eaten') {
          if (frightTimer > 0 && g.state === 'free') {
            g.state = 'eaten'; ghostsEatenChain++;
            pacScore += Math.min(1600, 200 * Math.pow(2, ghostsEatenChain - 1));
          } else if (pac.invuln <= 0) {
            if (--pacLives <= 0) initPacGame(true);
            else resetPacEntities();
          }
        }
      });
    }

    function drawPac() {
      ctx.lineWidth = 2;
      walls.forEach(w => {
        ctx.fillStyle = '#02030a'; ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#0022ff'; ctx.shadowColor = 'rgba(0, 34, 255, 0.9)'; ctx.shadowBlur = 4;
        ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
      });
      ctx.shadowBlur = 0;
      if (ghostPenGate) { ctx.fillStyle = '#ffb8de'; ctx.fillRect(ghostPenGate.x, ghostPenGate.y, ghostPenGate.w, ghostPenGate.h); }
      ctx.fillStyle = '#ffe066';
      pellets.forEach(p => { if (!p.eaten) { ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill(); } });
      powerPellets.forEach(p => { if (!p.eaten) { ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2); ctx.fill(); } });

      if (pac.invuln % 6 < 3) {
        ctx.fillStyle = '#ffee00'; ctx.save(); ctx.translate(pac.x + pac.w / 2, pac.y + pac.h / 2);
        let angle = 0;
        if (pac.dirX === 1) angle = 0; if (pac.dirX === -1) angle = Math.PI;
        if (pac.dirY === 1) angle = Math.PI / 2; if (pac.dirY === -1) angle = -Math.PI / 2;
        ctx.rotate(angle);
        const mouthCut = 0.35 * pac.mouth;
        ctx.beginPath(); ctx.arc(0, 0, pac.w / 2, mouthCut * Math.PI, (2 - mouthCut) * Math.PI); ctx.lineTo(0, 0); ctx.fill(); ctx.restore();
      }

      ghosts.forEach(g => {
        ctx.save();
        const isFrightened = frightTimer > 0 && g.state === 'free';
        const isFlashing = isFrightened && frightTimer < 150 && Math.floor(frightTimer / 15) % 2 === 0;

        if (g.state === 'eaten') {
          ctx.fillStyle = '#fff'; ctx.fillRect(g.x + 3, g.y + 4, 5, 5); ctx.fillRect(g.x + 11, g.y + 4, 5, 5);
        } else if (isFrightened) {
          ctx.fillStyle = isFlashing ? '#ffffff' : '#2563eb';
          ctx.beginPath(); ctx.arc(g.x + g.w / 2, g.y + g.h / 3, g.w / 2, Math.PI, 0, false);
          ctx.lineTo(g.x + g.w, g.y + g.h); ctx.lineTo(g.x, g.y + g.h); ctx.closePath(); ctx.fill();
        } else {
          ctx.fillStyle = g.color; ctx.beginPath(); ctx.arc(g.x + g.w / 2, g.y + g.h / 3, g.w / 2, Math.PI, 0, false);
          ctx.lineTo(g.x + g.w, g.y + g.h); ctx.lineTo(g.x, g.y + g.h); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      });

      drawHUD(pacScore, pacStartTime, pacLives, '#0044ff', pacLevel, frightTimer > 0 ? `POWER: ${Math.ceil(frightTimer / 60)}s` : null);
    }

    // Sunset Chaser Engine
    const racer = { playerX: 0, speed: 1.2, roadOffset: 0, steerAngle: 0 };
    let trafficCars = [], meteors = [], racerScore = 0, racerStartTime = Date.now();

    function initSynthRacer(fullReset = true) {
      if (fullReset) { racerScore = 0; racerStartTime = Date.now(); }
      racer.playerX = 0; racer.speed = 1.2; racer.roadOffset = 0; racer.steerAngle = 0;
      trafficCars = []; meteors = [];
      for (let i = 0; i < 5; i++) {
        trafficCars.push({ x: (Math.random() * 1.6) - 0.8, z: 150 + i * 160, color: i % 2 === 0 ? '#00e5ff' : '#ff007f', speed: 0.7 + Math.random() * 0.5 });
      }
    }

    function updateSynthRacer() {
      let targetSteer = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) { racer.playerX = Math.max(-0.9, racer.playerX - 0.035); targetSteer = -0.5; }
      if (keys['ArrowRight'] || keys['KeyD']) { racer.playerX = Math.min(0.9, racer.playerX + 0.035); targetSteer = 0.5; }
      racer.steerAngle += (targetSteer - racer.steerAngle) * 0.18;
      if (keys['ArrowUp'] || keys['KeyW'] || keys['Space']) racer.speed = Math.min(2.8, racer.speed + 0.05);
      else racer.speed = Math.max(1.1, racer.speed - 0.025);

      racer.roadOffset = (racer.roadOffset + racer.speed * 10) % 60;
      racerScore += Math.floor(racer.speed * 3);

      if (Math.random() < 0.035 && meteors.length < 4) {
        meteors.push({ x: Math.random() * width, y: Math.random() * (height * 0.3), len: 80, speed: 16, alpha: 1.0 });
      }
      for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i]; m.x -= m.speed * 1.4; m.y += m.speed * 0.7; m.alpha -= 0.03;
        if (m.alpha <= 0) meteors.splice(i, 1);
      }
      trafficCars.forEach(car => {
        car.z -= (racer.speed * 7 + car.speed * 3);
        if (car.z < 20) {
          if (Math.abs(car.x - racer.playerX) < 0.3) { racer.speed = 0.8; racerScore = Math.max(0, racerScore - 150); }
          car.z = 750 + Math.random() * 150; car.x = (Math.random() * 1.6) - 0.8;
        }
      });
    }

    function drawSynthRacer() {
      const horizonY = height * 0.46;
      const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, '#090214'); skyGrad.addColorStop(0.7, '#240738'); skyGrad.addColorStop(1, '#ff007f');
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, width, horizonY);

      meteors.forEach(m => {
        ctx.save(); ctx.strokeStyle = `rgba(0, 255, 255, ${m.alpha})`; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + m.len, m.y - m.len * 0.5); ctx.stroke(); ctx.restore();
      });

      const sunRadius = Math.min(width, height) * 0.18, sunX = width / 2, sunY = horizonY - 20;
      const sunGrad = ctx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY + sunRadius);
      sunGrad.addColorStop(0, '#ffee55'); sunGrad.addColorStop(0.6, '#ff007f'); sunGrad.addColorStop(1, '#7900ff');
      ctx.fillStyle = sunGrad; ctx.beginPath(); ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#090214';
      for (let i = 0; i < 7; i++) {
        const sliceY = sunY + (i * 12);
        if (sliceY < horizonY) ctx.fillRect(sunX - sunRadius, sliceY, sunRadius * 2, 2 + i * 0.8);
      }

      const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
      groundGrad.addColorStop(0, '#10021c'); groundGrad.addColorStop(1, '#05000a');
      ctx.fillStyle = groundGrad; ctx.fillRect(0, horizonY, width, height - horizonY);

      const roadCenterHorizon = width / 2 - (racer.playerX * 80);
      const roadBottomCenter = width / 2 - (racer.playerX * (width * 0.5));
      const roadBottomWidth = width * 1.1;

      ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(roadCenterHorizon - 30, horizonY); ctx.lineTo(roadBottomCenter - roadBottomWidth / 2, height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(roadCenterHorizon + 30, horizonY); ctx.lineTo(roadBottomCenter + roadBottomWidth / 2, height); ctx.stroke();
      ctx.shadowBlur = 0;

      trafficCars.forEach((c) => {
        if (c.z > 20 && c.z < 750) {
          const depthScale = 60 / c.z, carY = horizonY + (height - horizonY) * depthScale;
          const carScreenX = roadCenterHorizon + (c.x * width * 0.45 * depthScale);
          const carW = 120 * depthScale, carH = 50 * depthScale;
          if (carY > horizonY && carY < height - 40) {
            ctx.fillStyle = c.color; ctx.shadowColor = c.color; ctx.shadowBlur = 10;
            ctx.fillRect(carScreenX - carW / 2, carY - carH, carW, carH);
          }
        }
      });
      ctx.shadowBlur = 0;
      drawHUD(racerScore, racerStartTime, null, '#ff007f');
    }

    // Fantasy Quest Engine (RPG)
    const hero = { x: 100, y: 100, w: 26, h: 32, speed: 3.8, facingX: 1, facingY: 0, invuln: 0, attackCooldown: 0, weapon: 'sword', shields: 0, attackAnimTimer: 0 };
    let obstacles = [], bridge = null, npcs = [], heroProjectiles = [], enemyProjectiles = [];
    let lootDrops = [], meleeSlash = null, groundDetails = [];
    let rpgScore = 0, rpgLives = 3, rpgWave = 1, rpgStartTime = Date.now(), rpgTicks = 0;

    function initRPGGame(fullReset = true) {
      if (fullReset) { rpgScore = 0; rpgLives = 3; rpgWave = 1; rpgStartTime = Date.now(); hero.weapon = 'sword'; hero.shields = 0; }
      generateWorldObstacles();
      hero.x = bridge.x + bridge.w / 2 - hero.w / 2; hero.y = bridge.y + bridge.h / 2 - hero.h / 2;
      hero.facingX = 1; hero.facingY = 0;
      hero.invuln = 60; hero.attackCooldown = 0; hero.attackAnimTimer = 0;
      heroProjectiles = []; enemyProjectiles = []; lootDrops = []; meleeSlash = null;
      spawnWaveNPCs();
    }

    function generateWorldObstacles() {
      obstacles = []; groundDetails = [];
      const riverW = 54, riverX = width * 0.42;
      bridge = { x: riverX - 8, y: height * 0.45, w: riverW + 16, h: 72 };
      obstacles.push({ type: 'river', x: riverX, y: 0, w: riverW, h: bridge.y });
      obstacles.push({ type: 'river', x: riverX, y: bridge.y + bridge.h, w: riverW, h: height - (bridge.y + bridge.h) });
      for (let i = 0; i < 35; i++) {
        groundDetails.push({ x: 20 + Math.random() * (width - 40), y: 20 + Math.random() * (height - 40), color: Math.random() > 0.4 ? '#166534' : '#f59e0b', size: 2 + Math.random() * 2 });
      }
    }

    function spawnWaveNPCs() {
      npcs = [];
      const swordSkelCount = rpgWave === 1 ? 2 : Math.min(4, rpgWave);
      for (let i = 0; i < swordSkelCount; i++) {
        npcs.push({ type: 'skeleton_sword', x: 200 + i * 40, y: 200, w: 24, h: 30, hp: 1, maxHp: 1, speed: 1.2, aggroRadius: 160, state: 'wander', wanderDir: { x: 1, y: 0 }, wanderTimer: 60 });
      }
    }

    function performHeroAttack() {
      if (hero.attackCooldown > 0) return;
      const cx = hero.x + hero.w / 2, cy = hero.y + hero.h / 2;
      let fx = hero.facingX, fy = hero.facingY;
      if (fx === 0 && fy === 0) fx = 1;
      hero.attackAnimTimer = 14;
      meleeSlash = { x: cx + fx * 20 - 16, y: cy + fy * 20 - 16, w: 32, h: 32, damage: 1, life: 10, type: 'sword' };
      hero.attackCooldown = 17;
    }

    function takeHeroDamage() {
      if (hero.invuln > 0) return;
      if (hero.shields > 0) hero.shields--;
      else if (--rpgLives <= 0) { initRPGGame(true); return; }
      hero.invuln = 70;
    }

    function updateRPG() {
      rpgTicks++;
      if (hero.invuln > 0) hero.invuln--;
      if (hero.attackCooldown > 0) hero.attackCooldown--;
      if (hero.attackAnimTimer > 0) hero.attackAnimTimer--;

      let mx = 0, my = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) mx -= 1;
      if (keys['ArrowRight'] || keys['KeyD']) mx += 1;
      if (keys['ArrowUp'] || keys['KeyW']) my -= 1;
      if (keys['ArrowDown'] || keys['KeyS']) my += 1;

      if (mx !== 0 || my !== 0) {
        hero.facingX = mx; hero.facingY = my;
        const norm = Math.hypot(mx, my);
        hero.x += (mx / norm) * hero.speed;
        hero.y += (my / norm) * hero.speed;
      }
      hero.x = Math.max(10, Math.min(width - hero.w - 10, hero.x));
      hero.y = Math.max(10, Math.min(height - hero.h - 10, hero.y));

      if (meleeSlash) {
        meleeSlash.life--;
        for (let m of npcs) {
          if (m.hp > 0 && checkRectCollision(meleeSlash, m)) {
            m.hp -= meleeSlash.damage; m.state = 'aggro';
          }
        }
        if (meleeSlash.life <= 0) meleeSlash = null;
      }

      npcs.forEach(npc => {
        if (checkRectCollision(hero, npc)) takeHeroDamage();
      });

      for (let i = npcs.length - 1; i >= 0; i--) {
        if (npcs[i].hp <= 0) { rpgScore += 100; npcs.splice(i, 1); }
      }
      if (npcs.length === 0) { rpgWave++; rpgScore += 800; spawnWaveNPCs(); }
    }

    function drawRPG() {
      ctx.fillStyle = '#101d14'; ctx.fillRect(0, 0, width, height);
      groundDetails.forEach(gd => { ctx.fillStyle = gd.color; ctx.fillRect(gd.x, gd.y, gd.size, gd.size * 1.5); });
      if (bridge) { ctx.fillStyle = '#92400e'; ctx.fillRect(bridge.x, bridge.y, bridge.w, bridge.h); }
      npcs.forEach(m => {
        ctx.fillStyle = '#f1f5f9'; ctx.fillRect(m.x, m.y, m.w, m.h);
      });
      ctx.fillStyle = '#312e81'; ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
      drawHUD(rpgScore, rpgStartTime, rpgLives, '#f59e0b', rpgWave, `WEAPON: ${hero.weapon.toUpperCase()}`);
    }

    /* ==========================================
       7. MAIN APPLICATION LOOP & THEME CONTROLS
       ========================================== */
    themeSelect.addEventListener('change', (e) => {
      const selected = e.target.value;
      document.body.classList.remove('theme-pac-cube', 'theme-synthwave', 'theme-boring', 'theme-rpg');

      if (selected === 'space') {
        currentTheme = 'space';
        gameHint.textContent = '[ PLAY THE BACKGROUND: USE LEFT/RIGHT ARROWS TO MOVE • SPACEBAR TO SHOOT ]';
        initInvaders(true);
      } else if (selected === 'pac') {
        currentTheme = 'pac'; document.body.classList.add('theme-pac-cube');
        gameHint.textContent = '[ PLAY THE BACKGROUND: ARROWS / WASD TO NAVIGATE • EAT POWER PELLETS ]';
        initPacGame(true);
      } else if (selected === 'synth') {
        currentTheme = 'synth'; document.body.classList.add('theme-synthwave');
        gameHint.textContent = '[ PLAY THE BACKGROUND: FIRST-PERSON COCKPIT • LEFT/RIGHT TO STEER ]';
        initSynthRacer(true);
      } else if (selected === 'rpg') {
        currentTheme = 'rpg'; document.body.classList.add('theme-rpg');
        gameHint.textContent = '[ PLAY THE BACKGROUND: ARROWS/WASD TO EXPLORE • SPACEBAR TO ATTACK ]';
        initRPGGame(true);
      } else if (selected === 'boring') {
        currentTheme = 'boring'; document.body.classList.add('theme-boring');
        gameHint.textContent = '[ BORING MODE: NO ACTIVE GAME ]';
      }
    });

    initInvaders(true);

    function loop() {
      ctx.clearRect(0, 0, width, height);
      if (currentTheme === 'space') { updateSpace(); drawSpace(); }
      else if (currentTheme === 'pac') { updatePac(); drawPac(); }
      else if (currentTheme === 'synth') { updateSynthRacer(); drawSynthRacer(); }
      else if (currentTheme === 'rpg') { updateRPG(); drawRPG(); }
      requestAnimationFrame(loop);
    }

    loop();
  </script>
